name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One in-flight release per tag. Re-pushing a tag (force-move) cancels the
# superseded run so it can't race the new one to PyPI.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v6
        with:
          path: data
          key: test-data-v6

      - name: Download test data
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/skyview_10deg_test_images data/tess_test_images data/tess_same_ccd
          BASE=https://storage.googleapis.com/tetra3rs-testvecs
          curl --fail -o data/gaia_merged.bin "$BASE/gaia_merged.bin"
          for f in orion_region_10deg pleiades_region_10deg cygnus_region_10deg \
                   andromeda_m31_10deg north_pole_10deg sagittarius_10deg \
                   cassiopeia_10deg scorpius_antares_10deg south_pole_10deg \
                   virgo_cluster_10deg; do
            curl --fail -o "data/skyview_10deg_test_images/${f}.fits" "$BASE/skyview_10deg_test_images/${f}.fits"
          done
          for f in moderate_density_field sparse_field_north_ecliptic dense_galactic_plane; do
            curl --fail -o "data/tess_test_images/${f}.fits" "$BASE/tess_test_images/${f}.fits"
          done
          for s in 01 02 03 04 05 06 13 14 15 17; do
            curl --fail -o "data/tess_same_ccd/sector${s}_cam1_ccd1.fits" "$BASE/tess_same_ccd/sector${s}_cam1_ccd1.fits"
          done

      - name: Install Python package
        run: pip install -e .[test]

      - name: Run Python tests
        run: pytest python/tests/ -v

  build-wheels:
    name: Build wheel (${{ matrix.os }} ${{ matrix.python }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Cross-product of OS × Python version: one job builds exactly one
      # wheel, so all 20 build concurrently instead of cibuildwheel looping
      # the Python versions serially (re-compiling the Rust ext each time).
      # Arch comes from CIBW_ARCHS=auto (the runner's native arch); the
      # unwanted auto extras (win32, i686, musllinux) are skipped in
      # pyproject.toml.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
        python: [cp311, cp312, cp313, cp314, cp315]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: pypa/cibuildwheel@v4.3.1
        env:
          # Build only this job's Python version (overrides pyproject `build`).
          CIBW_BUILD: ${{ matrix.python }}-*

      - uses: actions/upload-artifact@v7
        with:
          # Per-(os, python) artifact name — must be unique or the parallel
          # uploads collide. `publish` re-merges via merge-multiple.
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
