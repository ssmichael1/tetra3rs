[package]
name = "tetra3-python"
version = "0.14.0"
edition = "2021"
publish = false

[lib]
name = "tetra3rs"
crate-type = ["cdylib"]

[dependencies]
tetra3 = { path = "..", features = ["image", "parallel"] }
rayon = "1"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
numpy = "0.30.0"
log = "0.4"
postcard = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
numeris = { version = "0.6", features = ["std"] }

[build-dependencies]
pyo3-build-config = "0.30.1"
