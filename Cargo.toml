[workspace]
members = [".", "python"]

[package]
keywords = [
    "star-plate-solver",
    "astrometry",
    "astronomy",
    "image-processing",
    "pattern-recognition",
]
name = "tetra3"
version = "0.14.0"
edition = "2021"
description = "Rust implementation of Tetra3: Fast and robust star plate solver"
readme = "README.md"
license = "MIT AND Apache-2.0"
homepage = "https://tetra3rs.dev"
repository = "https://github.com/ssmichael1/tetra3rs"
categories = ["aerospace", "algorithms", "mathematics", "science"]
exclude = ["data/", "download_hip2.sh"]

[lib]
name = "tetra3"

[dependencies]
# Every dependency is pulled in with `default-features = false`; the `std`
# feature below re-enables their std support. `alloc` is always required.
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2", default-features = false }
log = { version = "0.4", default-features = false }
numeris = { version = "0.6", default-features = false, features = ["alloc", "serde", "optim"] }
# `core` has no `sin`/`sqrt`/…; on `no_std` builds the `Float` trait (backed by
# `libm`) supplies them. See `crate::prelude`.
num-traits = { version = "0.2", default-features = false }
image = { version = "0.25", optional = true, default-features = false }
rayon = { version = "1", optional = true }

# Browser wasm (wasm32-unknown-unknown) has no monotonic clock in `std`;
# web-time provides a drop-in `Instant` backed by `performance.now()`. Only
# pulled in on that target — see src/solver/clock.rs.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = { version = "1", optional = true }

[features]
default = ["std"]
# Standard library: file I/O (`load_from_file` / `save_to_file` /
# `generate_from_gaia`), the monotonic clock behind `solve_timeout_ms` and
# `solve_time_ms`, and `std::io::Error` in `Error::Io`. Disable for `no_std`
# targets (`default-features = false, features = ["libm"]`); `alloc` is still
# required. See the "no_std" section of the crate docs.
std = [
    "numeris/std",
    "num-traits/std",
    "serde/std",
    "thiserror/std",
    "log/std",
    "postcard/use-std",
    "dep:web-time",
]
# Software float math for `no_std` builds (`core` lacks `sin`, `sqrt`, …).
# Required when `std` is off; harmless (unused) when `std` is on.
libm = ["num-traits/libm", "numeris/libm"]
# Hipparcos text-catalog support (file-based; implies `std`).
hipparcos = ["std"]
# Leaf-level solver timing instrumentation (thread-local accumulators).
# Compiles to nothing when disabled. See src/solver/profiling.rs.
profile = ["std"]
# Centroid extraction also pulls in numeris's imageproc (used for CCL).
# The `image` crate needs `std`.
image = ["std", "dep:image", "numeris/imageproc"]
# Multi-threaded centroid extraction via rayon. Parallelizes the dominant
# local-background stage (independent block medians + interpolation rows) and
# the full-image element-wise maps; also enables numeris's rayon imageproc
# paths (e.g. the matched-filter Gaussian blur). Bit-identical results to the
# sequential build. Combine with `image`: `--features image,parallel`.
parallel = ["std", "dep:rayon", "numeris/rayon"]

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
rand = "0.10.0"
rand_distr = "0.6.0"
env_logger = "0.11"
ureq = "3"
fitskit = "0.3.0"

# integration tests use centroid extraction which needs the "image" feature
# The tests read their FITS images with `fitskit` (see tests/fits/mod.rs).
[[test]]
name = "skyview_solve_test"
path = "tests/skyview_solve_test.rs"
required-features = ["image"]

[[test]]
name = "tess_solve_test"
path = "tests/tess_solve_test.rs"
required-features = ["image"]
