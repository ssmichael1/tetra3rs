site_name: tetra3rs
site_description: Fast, robust lost-in-space star plate solver written in Rust
site_url: https://tetra3rs.dev/
repo_url: https://github.com/ssmichael1/tetra3rs
repo_name: ssmichael1/tetra3rs

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            allow_inspection: false
            show_source: false
            show_bases: false
            members_order: source
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
  - mkdocs-jupyter:
      # Notebooks only. By default the plugin probes every .md page as a
      # possible jupytext notebook; jupytext takes the mkdocstrings
      # `::: module.Name` directives for pandoc divs and, when pandoc is
      # installed, runs it and prints an "unclosed Div" warning per page.
      # `ignore` is checked before that probe from mkdocs-jupyter 0.26.3.
      ignore: ["*.md"]
      execute: true
      kernel_name: python3
      include_source: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Star Catalog: getting-started/catalog.md
      - Quick Start: getting-started/quickstart.md
  - Concepts:
      - Algorithm Overview: concepts/algorithm.md
      - Centroid Extraction: concepts/centroid-extraction.md
      - Coordinate Conventions: concepts/coordinates.md
      - Camera Model: concepts/camera-model.md
      - WCS Output: concepts/wcs.md
      - Stellar Aberration: concepts/aberration.md
      - Tracking Mode: concepts/tracking.md
  - Tutorials:
      - tutorials/index.md
      - Basic Plate Solving: tutorials/basic-solve.ipynb
      - Multi-Image Calibration: tutorials/multi-image-calibration.ipynb
  - API Reference:
      - Overview: api/index.md
      - SolverDatabase: api/solver-database.md
      - CameraModel: api/camera-model.md
      - SolveResult: api/solve-result.md
      - CalibrateResult: api/calibrate-result.md
      - Centroid Extraction: api/extraction.md
      - Distortion Models: api/distortion.md
      - Functions: api/functions.md
